<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Tabs</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#1a1a1a;overflow:hidden;user-select:none;font:13px "Segoe UI",system-ui,sans-serif}
#t{display:flex;height:100%;border-bottom:2px solid #ef4b52}
button{font:inherit;color:#8c8c8c;background:none;border:0;border-right:1px solid #383838;padding:0 18px;cursor:pointer;display:flex;align-items:center;gap:8px}
button:hover{background:#222}
button.on{color:#ebebeb;background:#2a2a2a;box-shadow:inset 0 -3px 0 #ef4b52}
s{width:8px;height:8px;border-radius:50%;background:#555;display:block}
.r s{background:#43c984}
</style></head><body><div id="t"></div>
<script>
const idx = new URLSearchParams(location.search).get('screen');
const t = document.getElementById('t');
function draw(list){
  t.innerHTML = '';
  for (const a of list) {
    const b = document.createElement('button');
    b.className = (a.active ? 'on ' : '') + (a.running ? 'r' : '');
    b.innerHTML = '<s></s>'; b.append(a.name);
    b.title = a.running ? 'Bring ' + a.name + ' to the front' : 'Open ' + a.name;
    b.onclick = () => red.invoke('tab:click', a.id);
    t.append(b);
  }
}
red.on('tabs', draw);
red.invoke('tabs:get', idx).then(l => l && draw(l));
</script></body></html>
